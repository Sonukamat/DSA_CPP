name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Compile and Check C++ Files
      run: |
        find . -name "*.cpp" -exec g++ -std=c++17 -fsyntax-only {} +
